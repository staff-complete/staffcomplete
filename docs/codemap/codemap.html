      * {

      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 ui-sans-serif,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      a {
        color: var(--frontend);
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        flex: none;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        letter-spacing: 0.2px;
      }
      header .meta {
        color: var(--muted);
        font-size: 11.5px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      header .meta code {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 11px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        flex: none;
      }
      input[type='search'] {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 9px;
        width: 210px;
        font: inherit;
      }
      input[type='search']:focus {
        outline: none;
        border-color: var(--frontend);
      }
      button {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.active {
        border-color: var(--frontend);
        color: var(--frontend);
      }
      .sep {
        width: 1px;
        height: 20px;
        background: var(--border);
      }
      .label {
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .legend {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .legend button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        font-size: 11.5px;
      }
      .legend button.off {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        flex: none;
      }

      .flows {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .flows button {
        font-size: 11.5px;
        padding: 4px 9px;
      }

      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #stage {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      svg.panning {
        cursor: grabbing;
      }

      .boundary rect {
        fill: rgba(255, 255, 255, 0.018);
        stroke: var(--border);
        stroke-dasharray: 5 4;
        rx: 12;
      }
      .boundary text {
        fill: var(--muted);
        font-size: 10.5px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      .edge {
        fill: none;
        stroke-width: 1.4;
        opacity: 0.5;
      }
      .edge.hl {
        opacity: 1;
        stroke-width: 2.6;
      }
      .edge.dim {
        opacity: var(--dim);
      }
      .edge-label {
        fill: var(--muted);
        font-size: 9px;
        text-anchor: middle;
        pointer-events: none;
        opacity: 0;
      }
      .edge-label.hl {
        opacity: 1;
        fill: var(--text);
      }

      .node {
        cursor: pointer;
      }
      .node rect {
        rx: 7;
        fill: var(--panel);
        stroke-width: 1.6;
        transition: fill 0.12s;
      }
      .node:hover rect {
        fill: var(--panel-2);
      }
      .node text {
        pointer-events: none;
      }
      .node .n-label {
        fill: var(--text);
        font-size: 12px;
        font-weight: 600;
      }
      .node .n-path {
        fill: var(--muted);
        font-size: 9.5px;
        font-family: ui-monospace, monospace;
      }
      .node.dim {
        opacity: var(--dim);
      }
      .node.sel rect {
        stroke-width: 3;
        fill: var(--panel-2);
      }
      .node.up rect {
        stroke-dasharray: 4 3;
      }
      .node.down rect {
        stroke-dasharray: 4 3;
      }
      .node.hidden {
        display: none;
      }
      .node .badge {
        font-size: 9px;
        fill: var(--bg);
        font-weight: 700;
      }

      aside {
        width: 340px;
        flex: none;
        border-left: 1px solid var(--border);
        background: var(--panel);
        overflow-y: auto;
        padding: 14px 16px 40px;
      }
      aside h2 {
        font-size: 14px;
        margin: 0 0 2px;
      }
      aside .sub {
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        word-break: break-all;
        margin-bottom: 10px;
      }
      aside h3 {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--muted);
        margin: 16px 0 6px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 3px;
      }
      aside p {
        margin: 0 0 8px;
      }
      aside ul {
        margin: 0;
        padding-left: 16px;
      }
      aside li {
        margin-bottom: 5px;
      }
      aside code {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
        font-size: 10.5px;
        font-family: ui-monospace, monospace;
        word-break: break-all;
      }
      .pill {
        display: inline-block;
        border-radius: 10px;
        padding: 1px 8px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #0d1117;
        margin-bottom: 8px;
      }
      .rel {
        cursor: pointer;
        color: var(--frontend);
      }
      .rel:hover {
        text-decoration: underline;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
      }
      .hint {
        color: var(--muted);
        font-size: 11.5px;
      }
      .kbd {
        border: 1px solid var(--border);
        background: var(--panel-2);
        border-radius: 3px;
        padding: 0 4px;
        font-size: 10.5px;
      }
    </style>

    <script>
      const DATA = JSON.parse(document.getElementById('cm-data').textContent)
      const REPO = 'staff-complete/staffcomplete'

      const TYPE_COLOR = {
        frontend: '#58a6ff',
        shared: '#d2a8ff',
        api: '#3fb950',
        route: '#56d4dd',
        worker: '#e3b341',
        data: '#ff7b72',
        queue: '#ffa657',
        external: '#8b949e',
      }
      const TYPE_LABEL = {
        frontend: 'Frontend',
        shared: 'Shared contracts',
        api: 'API core',
        route: 'HTTP route',
        worker: 'Worker / engine',
        data: 'Data layer',
        queue: 'Queue',
        external: 'External',
      }
      const EDGE_COLOR = {
        imports: '#7d8590',
        calls: '#58a6ff',
        reads: '#3fb950',
        writes: '#ff7b72',
        publishes: '#ffa657',
        subscribes: '#d2a8ff',
      }

      // ---- layout: columns + barycenter sweeps to reduce edge crossings ----
      const COLUMNS = [
        { title: 'Browser', ids: ['web-spa', 'web-composables', 'web-client-lib'] },
        { title: 'API core', ids: ['api-app', 'api-auth', 'api-org-auth'] },
        {
          title: 'HTTP routes',
          ids: [
            'api-onboard',
            'api-invites',
            'api-checklists',
            'api-runs',
            'api-tasks',
            'api-billing',
            'api-activity',
          ],
        },
        { title: 'Engine & jobs', ids: ['api-run-steps', 'api-jobs', 'api-queue'] },
        { title: 'Contracts & data', ids: ['api-db', 'shared-domain'] },
        { title: 'External', ids: ['postgres', 'resend'] },
      ]

      const NW = 176,
        NH = 54,
        COL_GAP = 108,
        ROW_GAP = 26,
        PAD_X = 40,
        PAD_Y = 64

      const byId = new Map(DATA.nodes.map((n) => [n.id, n]))
      const order = COLUMNS.map((c) => c.ids.slice())

      // barycenter ordering: repeatedly reorder each column by the mean index
      // of its neighbors in the adjacent columns, which is the standard cheap
      // heuristic for minimizing crossings in a layered layout.
      const colOf = new Map()
      order.forEach((ids, ci) => ids.forEach((id) => colOf.set(id, ci)))
      const neighbors = new Map(DATA.nodes.map((n) => [n.id, []]))
      for (const e of DATA.edges) {
        if (!byId.has(e.from) || !byId.has(e.to)) continue
        neighbors.get(e.from).push(e.to)
        neighbors.get(e.to).push(e.from)
      }
      function indexIn(ci, id) {
        const i = order[ci].indexOf(id)
        return i < 0 ? null : i
      }
      for (let sweep = 0; sweep < 12; sweep++) {
        for (let ci = 0; ci < order.length; ci++) {
          const scored = order[ci].map((id, i) => {
            const vals = []
            for (const nb of neighbors.get(id)) {
              const nc = colOf.get(nb)
              if (nc === ci) continue
              const idx = indexIn(nc, nb)
              if (idx != null)
                vals.push(
                  (idx / Math.max(1, order[nc].length - 1)) * Math.max(1, order[ci].length - 1),
                )
            }
            const barycenter = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : i
            return { id, barycenter, i }
          })
          scored.sort((a, b) => a.barycenter - b.barycenter || a.i - b.i)
          order[ci] = scored.map((s) => s.id)
        }
      }

      const pos = new Map()
      const tallest = Math.max(...order.map((c) => c.length))
      const stageH = PAD_Y + tallest * (NH + ROW_GAP) + PAD_Y
      order.forEach((ids, ci) => {
        const x = PAD_X + ci * (NW + COL_GAP)
        const colH = ids.length * (NH + ROW_GAP) - ROW_GAP
        const y0 = (stageH - colH) / 2
        ids.forEach((id, ri) => pos.set(id, { x, y: y0 + ri * (NH + ROW_GAP) }))
      })
      const stageW = PAD_X + order.length * (NW + COL_GAP) - COL_GAP + PAD_X

      // system boundaries drawn behind the columns
      const BOUNDARIES = [
        { title: 'Browser', cols: [0], color: '#58a6ff' },
        { title: 'API server (Hono + workers)', cols: [1, 2, 3], color: '#3fb950' },
        { title: 'Contracts', cols: [4], color: '#d2a8ff' },
        { title: 'External services', cols: [5], color: '#8b949e' },
      ]

      // ---- derived relationship indexes ----
      const upstream = new Map(DATA.nodes.map((n) => [n.id, new Set()]))
      const downstream = new Map(DATA.nodes.map((n) => [n.id, new Set()]))
      for (const e of DATA.edges) {
        if (!byId.has(e.from) || !byId.has(e.to)) continue
        downstream.get(e.from).add(e.to)
        upstream.get(e.to).add(e.from)
      }
      const flowsOf = new Map(DATA.nodes.map((n) => [n.id, []]))
      for (const f of DATA.flows) for (const s of new Set(f.steps)) flowsOf.get(s)?.push(f.id)
      const flowById = new Map(DATA.flows.map((f) => [f.id, f]))

      // ---- state ----
      let selectedNode = null
      let selectedFlow = null
      let query = ''
      const hiddenTypes = new Set()

      // ---- header ----
      document.getElementById('repo-name').textContent = REPO
      document.getElementById('gen-time').textContent = DATA.generated_at
      document.getElementById('gen-commit').textContent = (DATA.generated_from_commit || '').slice(
        0,
        12,
      )
      document.getElementById('gen-scope').textContent = DATA.scope.join(', ')
      document.getElementById('gen-counts').textContent =
        DATA.nodes.length +
        ' nodes · ' +
        DATA.edges.length +
        ' edges · ' +
        DATA.flows.length +
        ' flows'

      // ---- legend / filters ----
      const legendEl = document.getElementById('legend')
      for (const t of Object.keys(TYPE_COLOR)) {
        if (!DATA.nodes.some((n) => n.role === t)) continue
        const b = document.createElement('button')
        b.innerHTML =
          '<span class="swatch" style="background:' + TYPE_COLOR[t] + '"></span>' + TYPE_LABEL[t]
        b.onclick = () => {
          hiddenTypes.has(t) ? hiddenTypes.delete(t) : hiddenTypes.add(t)
          b.classList.toggle('off', hiddenTypes.has(t))
          render()
        }
        legendEl.appendChild(b)
      }

      const flowEl = document.getElementById('flow-buttons')
      for (const f of DATA.flows) {
        const b = document.createElement('button')
        b.textContent = f.name
        b.dataset.flow = f.id
        b.onclick = () => {
          selectedFlow = selectedFlow === f.id ? null : f.id
          selectedNode = null
          render()
        }
        flowEl.appendChild(b)
      }

      document.getElementById('search').oninput = (e) => {
        query = e.target.value.trim().toLowerCase()
        render()
      }
      document.getElementById('reset').onclick = () => {
        selectedNode = null
        selectedFlow = null
        query = ''
        document.getElementById('search').value = ''
        hiddenTypes.clear()
        ;[...legendEl.children].forEach((c) => c.classList.remove('off'))
        view = { x: 0, y: 0, k: 1 }
        fit()
        render()
      }

      // ---- svg build ----
      const svg = document.getElementById('svg')
      const viewport = document.getElementById('viewport')
      const defs = document.getElementById('defs')
      for (const [type, color] of Object.entries(EDGE_COLOR)) {
        defs.insertAdjacentHTML(
          'beforeend',
          '<marker id="arrow-' +
            type +
            '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
            '<path d="M 0 0 L 10 5 L 0 10 z" fill="' +
            color +
            '"/></marker>',
        )
      }

      const gB = document.getElementById('g-boundaries')
      for (const b of BOUNDARIES) {
        const x0 = PAD_X + b.cols[0] * (NW + COL_GAP) - 18
        const last = b.cols[b.cols.length - 1]
        const x1 = PAD_X + last * (NW + COL_GAP) + NW + 18
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
        g.setAttribute('class', 'boundary')
        g.innerHTML =
          '<rect x="' +
          x0 +
          '" y="26" width="' +
          (x1 - x0) +
          '" height="' +
          (stageH - 52) +
          '" style="stroke:' +
          b.color +
          '33"/>' +
          '<text x="' +
          (x0 + 12) +
          '" y="46">' +
          b.title +
          '</text>'
        gB.appendChild(g)
      }

      const gE = document.getElementById('g-edges')
      const gEL = document.getElementById('g-edge-labels')
      const gN = document.getElementById('g-nodes')

      function anchors(a, b) {
        const dx = b.x - a.x
        if (dx > 0) return [{ x: a.x + NW, y: a.y + NH / 2 }, { x: b.x, y: b.y + NH / 2 }, 1]
        if (dx < 0) return [{ x: a.x, y: a.y + NH / 2 }, { x: b.x + NW, y: b.y + NH / 2 }, -1]
        return [{ x: a.x + NW, y: a.y + NH / 2 }, { x: b.x + NW, y: b.y + NH / 2 }, 0]
      }
      function pathFor(a, b) {
        const [s, t, dir] = anchors(a, b)
        if (dir === 0) {
          const off = 54
          return (
            'M' +
            s.x +
            ',' +
            s.y +
            ' C' +
            (s.x + off) +
            ',' +
            s.y +
            ' ' +
            (t.x + off) +
            ',' +
            t.y +
            ' ' +
            t.x +
            ',' +
            t.y
          )
        }
        const c = Math.max(46, Math.abs(t.x - s.x) * 0.45) * dir
        return (
          'M' +
          s.x +
          ',' +
          s.y +
          ' C' +
          (s.x + c) +
          ',' +
          s.y +
          ' ' +
          (t.x - c) +
          ',' +
          t.y +
          ' ' +
          t.x +
          ',' +
          t.y
        )
      }

      const edgeEls = DATA.edges.map((e, i) => {
        const a = pos.get(e.from),
          b = pos.get(e.to)
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        p.setAttribute('class', 'edge')
        p.setAttribute('d', pathFor(a, b))
        p.setAttribute('stroke', EDGE_COLOR[e.type])
        p.setAttribute('marker-end', 'url(#arrow-' + e.type + ')')
        gE.appendChild(p)
        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        lbl.setAttribute('class', 'edge-label')
        lbl.textContent = e.type
        gEL.appendChild(lbl)
        return { e, p, lbl, i }
      })
      function placeLabels() {
        for (const { e, p, lbl } of edgeEls) {
          const len = p.getTotalLength()
          if (!len) continue
          const pt = p.getPointAtLength(len / 2)
          lbl.setAttribute('x', pt.x)
          lbl.setAttribute('y', pt.y - 5)
        }
      }

      const nodeEls = DATA.nodes.map((n) => {
        const p = pos.get(n.id)
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
        g.setAttribute('class', 'node')
        g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')')
        const color = TYPE_COLOR[n.role] || '#8b949e'
        const label = n.label || n.id
        const short = n.path.replace(/^apps\/|^packages\//, '')
        g.innerHTML =
          '<rect width="' +
          NW +
          '" height="' +
          NH +
          '" stroke="' +
          color +
          '"/>' +
          '<rect x="0" y="0" width="4" height="' +
          NH +
          '" fill="' +
          color +
          '" rx="2"/>' +
          '<text class="n-label" x="13" y="22">' +
          esc(label) +
          '</text>' +
          '<text class="n-path" x="13" y="38">' +
          esc(short) +
          '</text>'
        g.onclick = (ev) => {
          ev.stopPropagation()
          selectedNode = selectedNode === n.id ? null : n.id
          selectedFlow = null
          render()
        }
        makeDraggable(g, n.id)
        gN.appendChild(g)
        return { n, g }
      })

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        )
      }

      // ---- drag nodes ----
      function makeDraggable(g, id) {
        let start = null
        g.addEventListener('pointerdown', (ev) => {
          ev.stopPropagation()
          start = { mx: ev.clientX, my: ev.clientY, ...pos.get(id) }
          g.setPointerCapture(ev.pointerId)
        })
        g.addEventListener('pointermove', (ev) => {
          if (!start) return
          const p = pos.get(id)
          p.x = start.x + (ev.clientX - start.mx) / view.k
          p.y = start.y + (ev.clientY - start.my) / view.k
          g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')')
          for (const { e, p: path } of edgeEls) {
            if (e.from === id || e.to === id)
              path.setAttribute('d', pathFor(pos.get(e.from), pos.get(e.to)))
          }
          placeLabels()
        })
        const end = (ev) => {
          if (start) {
            start = null
            try {
              g.releasePointerCapture(ev.pointerId)
            } catch {}
          }
        }
        g.addEventListener('pointerup', end)
        g.addEventListener('pointercancel', end)
      }

      // ---- pan & zoom ----
      let view = { x: 0, y: 0, k: 1 }
      function applyView() {
        viewport.setAttribute(
          'transform',
          'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')',
        )
      }
      function fit() {
        const r = svg.getBoundingClientRect()
        const k = Math.min(r.width / stageW, r.height / stageH, 1.15) * 0.94
        view.k = k
        view.x = (r.width - stageW * k) / 2
        view.y = (r.height - stageH * k) / 2
        applyView()
      }
      svg.addEventListener(
        'wheel',
        (ev) => {
          ev.preventDefault()
          const r = svg.getBoundingClientRect()
          const mx = ev.clientX - r.left,
            my = ev.clientY - r.top
          const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12
          const nk = Math.min(3, Math.max(0.25, view.k * f))
          view.x = mx - ((mx - view.x) * nk) / view.k
          view.y = my - ((my - view.y) * nk) / view.k
          view.k = nk
          applyView()
        },
        { passive: false },
      )
      let pan = null
      svg.addEventListener('pointerdown', (ev) => {
        pan = { mx: ev.clientX, my: ev.clientY, x: view.x, y: view.y }
        svg.classList.add('panning')
      })
      svg.addEventListener('pointermove', (ev) => {
        if (!pan) return
        view.x = pan.x + (ev.clientX - pan.mx)
        view.y = pan.y + (ev.clientY - pan.my)
        applyView()
      })
      const endPan = () => {
        pan = null
        svg.classList.remove('panning')
      }
      svg.addEventListener('pointerup', endPan)
      svg.addEventListener('pointerleave', endPan)
      svg.addEventListener('click', (ev) => {
        if (ev.target === svg || ev.target.closest('.boundary')) {
          selectedNode = null
          selectedFlow = null
          render()
        }
      })

      // ---- render / highlight ----
      function matches(n) {
        if (!query) return false
        const hay = [
          n.id,
          n.path,
          n.label,
          n.role,
          n.summary,
          (n.grouped_files || []).join(' '),
          n.tests.join(' '),
          n.entrypoints.map((e) => e.symbol + ' ' + e.path).join(' '),
          n.evidence.map((e) => e.symbol + ' ' + e.path).join(' '),
          n.constraints.join(' '),
        ]
          .join(' ')
          .toLowerCase()
        return hay.includes(query)
      }

      function render() {
        const visible = (n) => !hiddenTypes.has(n.role)
        let hlNodes = null,
          hlEdges = null

        if (selectedFlow) {
          const f = flowById.get(selectedFlow)
          hlNodes = new Set(f.steps)
          hlEdges = new Set()
          for (let i = 0; i < f.steps.length - 1; i++) {
            const a = f.steps[i],
              b = f.steps[i + 1]
            edgeEls.forEach(({ e }, idx) => {
              if ((e.from === a && e.to === b) || (e.from === b && e.to === a)) hlEdges.add(idx)
            })
          }
        } else if (selectedNode) {
          hlNodes = new Set([
            selectedNode,
            ...upstream.get(selectedNode),
            ...downstream.get(selectedNode),
          ])
          hlEdges = new Set()
          edgeEls.forEach(({ e }, idx) => {
            if (e.from === selectedNode || e.to === selectedNode) hlEdges.add(idx)
          })
        } else if (query) {
          hlNodes = new Set(DATA.nodes.filter(matches).map((n) => n.id))
          hlEdges = new Set()
          edgeEls.forEach(({ e }, idx) => {
            if (hlNodes.has(e.from) && hlNodes.has(e.to)) hlEdges.add(idx)
          })
        }

        for (const { n, g } of nodeEls) {
          g.classList.toggle('hidden', !visible(n))
          g.classList.toggle('sel', n.id === selectedNode)
          g.classList.toggle('up', !!selectedNode && upstream.get(selectedNode).has(n.id))
          g.classList.toggle('down', !!selectedNode && downstream.get(selectedNode).has(n.id))
          g.classList.toggle('dim', !!hlNodes && !hlNodes.has(n.id))
        }
        edgeEls.forEach(({ e, p, lbl }, idx) => {
          const vis = visible(byId.get(e.from)) && visible(byId.get(e.to))
          p.style.display = vis ? '' : 'none'
          lbl.style.display = vis ? '' : 'none'
          const on = !!hlEdges && hlEdges.has(idx)
          p.classList.toggle('hl', on)
          lbl.classList.toggle('hl', on)
          p.classList.toggle('dim', !!hlEdges && !on)
        })
        ;[...flowEl.children].forEach((b) =>
          b.classList.toggle('active', b.dataset.flow === selectedFlow),
        )
        renderPanel()
      }

      function link(id) {
        const n = byId.get(id)
        return (
          '<span class="rel" data-goto="' + id + '">' + esc(n ? n.label || n.id : id) + '</span>'
        )
      }

      function renderPanel() {
        const el = document.getElementById('panel')
        if (selectedFlow) {
          const f = flowById.get(selectedFlow)
          el.innerHTML =
            '<h2>' +
            esc(f.name) +
            '</h2>' +
            '<div class="sub">flow · ' +
            esc(f.id) +
            '</div>' +
            '<h3>Trigger</h3><p>' +
            esc(f.trigger) +
            '</p>' +
            '<h3>Path (' +
            f.steps.length +
            ' steps)</h3><ol style="padding-left:18px;margin:0">' +
            f.steps.map((s) => '<li>' + link(s) + '</li>').join('') +
            '</ol>' +
            '<h3>Outcome</h3><p>' +
            esc(f.outcome) +
            '</p>'
          wireLinks(el)
          return
        }
        if (!selectedNode) {
          el.innerHTML =
            '<h2>Code map</h2>' +
            '<div class="sub">' +
            esc(REPO) +
            ' @ ' +
            esc((DATA.generated_from_commit || '').slice(0, 7)) +
            '</div>' +
            '<p class="hint">Click any module to see its upstream callers, downstream dependencies, tests and flows. Pick a flow above to light up its whole path.</p>' +
            '<h3>Controls</h3><ul class="hint">' +
            '<li><span class="kbd">click</span> a module — highlight its neighborhood</li>' +
            '<li><span class="kbd">drag</span> a module — reposition it</li>' +
            '<li><span class="kbd">drag</span> background — pan · <span class="kbd">wheel</span> — zoom</li>' +
            '<li><span class="kbd">search</span> — matches ids, paths, symbols, constraints</li>' +
            '</ul>' +
            '<h3>Flows</h3><ul>' +
            DATA.flows
              .map(
                (f) =>
                  '<li><span class="rel" data-flow="' + f.id + '">' + esc(f.name) + '</span></li>',
              )
              .join('') +
            '</ul>' +
            '<h3>Scope</h3><ul>' +
            DATA.scope.map((s) => '<li><code>' + esc(s) + '</code></li>').join('') +
            '</ul>'
          wireLinks(el)
          return
        }
        const n = byId.get(selectedNode)
        const ups = [...upstream.get(n.id)],
          downs = [...downstream.get(n.id)]
        const fl = flowsOf.get(n.id) || []
        const edgesIn = DATA.edges.filter((e) => e.to === n.id)
        const edgesOut = DATA.edges.filter((e) => e.from === n.id)
        el.innerHTML =
          '<span class="pill" style="background:' +
          (TYPE_COLOR[n.role] || '#8b949e') +
          '">' +
          esc(TYPE_LABEL[n.role] || n.role) +
          '</span>' +
          '<h2>' +
          esc(n.label || n.id) +
          '</h2>' +
          '<div class="sub">' +
          esc(n.path) +
          '</div>' +
          (n.summary ? '<p>' + esc(n.summary) + '</p>' : '') +
          section(
            'Upstream callers (' + ups.length + ')',
            ups.length
              ? '<ul>' +
                  edgesIn
                    .map(
                      (e) =>
                        '<li>' +
                        link(e.from) +
                        ' <code>' +
                        esc(e.type) +
                        '</code><br><code>' +
                        esc(e.evidence.path) +
                        ':' +
                        e.evidence.line +
                        '</code></li>',
                    )
                    .join('') +
                  '</ul>'
              : '<p class="empty">None — nothing in scope calls into this.</p>',
          ) +
          section(
            'Downstream dependencies (' + downs.length + ')',
            downs.length
              ? '<ul>' +
                  edgesOut
                    .map(
                      (e) =>
                        '<li>' +
                        link(e.to) +
                        ' <code>' +
                        esc(e.type) +
                        '</code><br><code>' +
                        esc(e.evidence.path) +
                        ':' +
                        e.evidence.line +
                        '</code></li>',
                    )
                    .join('') +
                  '</ul>'
              : '<p class="empty">None — this is a leaf.</p>',
          ) +
          section(
            'Flows (' + fl.length + ')',
            fl.length
              ? '<ul>' +
                  fl
                    .map(
                      (id) =>
                        '<li><span class="rel" data-flow="' +
                        id +
                        '">' +
                        esc(flowById.get(id).name) +
                        '</span></li>',
                    )
                    .join('') +
                  '</ul>'
              : '<p class="empty">Not part of a mapped flow.</p>',
          ) +
          section(
            'Tests (' + n.tests.length + ')',
            n.tests.length
              ? '<ul>' +
                  n.tests.map((t) => '<li><code>' + esc(t) + '</code></li>').join('') +
                  '</ul>'
              : '<p class="empty">No tests reference this module directly.</p>',
          ) +
          section(
            'Entrypoints',
            '<ul>' +
              n.entrypoints
                .map(
                  (e) =>
                    '<li><code>' +
                    esc(e.symbol) +
                    '</code><br><code>' +
                    esc(e.path) +
                    ':' +
                    e.line +
                    '</code></li>',
                )
                .join('') +
              '</ul>',
          ) +
          (n.grouped_files && n.grouped_files.length
            ? section(
                'Grouped files',
                '<ul>' +
                  n.grouped_files.map((f) => '<li><code>' + esc(f) + '</code></li>').join('') +
                  '</ul>',
              )
            : '') +
          section(
            'Constraints',
            n.constraints.length
              ? '<ul>' + n.constraints.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul>'
              : '<p class="empty">None recorded.</p>',
          ) +
          section(
            'Evidence',
            '<ul>' +
              n.evidence
                .map(
                  (e) =>
                    '<li><code>' +
                    esc(e.path) +
                    ':' +
                    e.line +
                    '</code><br><code>' +
                    esc(e.symbol) +
                    '</code></li>',
                )
                .join('') +
              '</ul>',
          )
        wireLinks(el)
      }
      function section(title, body) {
        return '<h3>' + esc(title) + '</h3>' + body
      }
      function wireLinks(el) {
        el.querySelectorAll('[data-goto]').forEach((s) => {
          s.onclick = () => {
            selectedNode = s.dataset.goto
            selectedFlow = null
            render()
          }
        })
        el.querySelectorAll('[data-flow]').forEach((s) => {
          s.onclick = () => {
            selectedFlow = s.dataset.flow
            selectedNode = null
            render()
          }
        })
      }

      window.addEventListener('resize', fit)
      fit()
      placeLabels()
      render()
    </script>
  </body>
</html>
