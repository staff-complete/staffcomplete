          "Cloudflare Pages project settings — build command, output directory, environment variables and the custom domain — live in the Cloudflare dashboard, not in this repo, so the map cannot evidence them."
        ]
      }
    </script>
    <script>
      const DATA = JSON.parse(document.getElementById('cm-data').textContent)
      const REPO = 'staff-complete/staffcomplete'

      const TYPE_COLOR = {
        frontend: '#58a6ff',
        shared: '#d2a8ff',
        api: '#3fb950',
        route: '#56d4dd',
        worker: '#e3b341',
        data: '#ff7b72',
        queue: '#ffa657',
        external: '#8b949e',
      }
      const TYPE_LABEL = {
        frontend: 'Frontend',
        shared: 'Shared contracts',
        api: 'API core',
        route: 'HTTP route',
        worker: 'Worker / engine',
        data: 'Data layer',
        queue: 'Queue',
        external: 'External',
      }
      const EDGE_COLOR = {
        imports: '#7d8590',
        calls: '#58a6ff',
        reads: '#3fb950',
        writes: '#ff7b72',
        publishes: '#ffa657',
        subscribes: '#d2a8ff',
      }

      // ---- layout: columns + barycenter sweeps to reduce edge crossings ----
      const COLUMNS = [
        { title: 'Page', ids: ['web-entry', 'web-chrome', 'web-sections'] },
        { title: 'Signup', ids: ['web-early-access-form'] },
        { title: 'Contract', ids: ['shared-early-access'] },
        { title: 'Edge function', ids: ['fn-early-access'] },
        { title: 'External', ids: ['resend', 'turnstile'] },
      ]

      const NW = 176,
        NH = 54,
        COL_GAP = 108,
        ROW_GAP = 26,
        PAD_X = 40,
        PAD_Y = 64

      const byId = new Map(DATA.nodes.map((n) => [n.id, n]))
      const order = COLUMNS.map((c) => c.ids.slice())

      // barycenter ordering: repeatedly reorder each column by the mean index
      // of its neighbors in the adjacent columns, which is the standard cheap
      // heuristic for minimizing crossings in a layered layout.
      const colOf = new Map()
      order.forEach((ids, ci) => ids.forEach((id) => colOf.set(id, ci)))
      const neighbors = new Map(DATA.nodes.map((n) => [n.id, []]))
      for (const e of DATA.edges) {
        if (!byId.has(e.from) || !byId.has(e.to)) continue
        neighbors.get(e.from).push(e.to)
        neighbors.get(e.to).push(e.from)
      }
      function indexIn(ci, id) {
        const i = order[ci].indexOf(id)
        return i < 0 ? null : i
      }
      for (let sweep = 0; sweep < 12; sweep++) {
        for (let ci = 0; ci < order.length; ci++) {
          const scored = order[ci].map((id, i) => {
            const vals = []
            for (const nb of neighbors.get(id)) {
              const nc = colOf.get(nb)
              if (nc === ci) continue
              const idx = indexIn(nc, nb)
              if (idx != null)
                vals.push(
                  (idx / Math.max(1, order[nc].length - 1)) * Math.max(1, order[ci].length - 1),
                )
            }
            const barycenter = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : i
            return { id, barycenter, i }
          })
          scored.sort((a, b) => a.barycenter - b.barycenter || a.i - b.i)
          order[ci] = scored.map((s) => s.id)
        }
      }

      const pos = new Map()
      const tallest = Math.max(...order.map((c) => c.length))
      const stageH = PAD_Y + tallest * (NH + ROW_GAP) + PAD_Y
      order.forEach((ids, ci) => {
        const x = PAD_X + ci * (NW + COL_GAP)
        const colH = ids.length * (NH + ROW_GAP) - ROW_GAP
        const y0 = (stageH - colH) / 2
        ids.forEach((id, ri) => pos.set(id, { x, y: y0 + ri * (NH + ROW_GAP) }))
      })
      const stageW = PAD_X + order.length * (NW + COL_GAP) - COL_GAP + PAD_X

      // system boundaries drawn behind the columns
      const BOUNDARIES = [
        { title: 'Browser', cols: [0], color: '#58a6ff' },
        { title: 'API server (Hono + workers)', cols: [1, 2, 3], color: '#3fb950' },
        { title: 'Contracts', cols: [4], color: '#d2a8ff' },
        { title: 'External services', cols: [5], color: '#8b949e' },
      ]

      // ---- derived relationship indexes ----
      const upstream = new Map(DATA.nodes.map((n) => [n.id, new Set()]))
      const downstream = new Map(DATA.nodes.map((n) => [n.id, new Set()]))
      for (const e of DATA.edges) {
        if (!byId.has(e.from) || !byId.has(e.to)) continue
        downstream.get(e.from).add(e.to)
        upstream.get(e.to).add(e.from)
      }
      const flowsOf = new Map(DATA.nodes.map((n) => [n.id, []]))
      for (const f of DATA.flows) for (const s of new Set(f.steps)) flowsOf.get(s)?.push(f.id)
      const flowById = new Map(DATA.flows.map((f) => [f.id, f]))

      // ---- state ----
      let selectedNode = null
      let selectedFlow = null
      let query = ''
      const hiddenTypes = new Set()

      // ---- header ----
      document.getElementById('repo-name').textContent = REPO
      document.getElementById('gen-time').textContent = DATA.generated_at
      document.getElementById('gen-commit').textContent = (DATA.generated_from_commit || '').slice(
        0,
        12,
      )
      document.getElementById('gen-scope').textContent = DATA.scope.join(', ')
      document.getElementById('gen-counts').textContent =
        DATA.nodes.length +
        ' nodes · ' +
        DATA.edges.length +
        ' edges · ' +
        DATA.flows.length +
        ' flows'

      // ---- legend / filters ----
      const legendEl = document.getElementById('legend')
      for (const t of Object.keys(TYPE_COLOR)) {
        if (!DATA.nodes.some((n) => n.role === t)) continue
        const b = document.createElement('button')
        b.innerHTML =
          '<span class="swatch" style="background:' + TYPE_COLOR[t] + '"></span>' + TYPE_LABEL[t]
        b.onclick = () => {
          hiddenTypes.has(t) ? hiddenTypes.delete(t) : hiddenTypes.add(t)
          b.classList.toggle('off', hiddenTypes.has(t))
          render()
        }
        legendEl.appendChild(b)
      }

      const flowEl = document.getElementById('flow-buttons')
      for (const f of DATA.flows) {
        const b = document.createElement('button')
        b.textContent = f.name
        b.dataset.flow = f.id
        b.onclick = () => {
          selectedFlow = selectedFlow === f.id ? null : f.id
          selectedNode = null
          render()
        }
        flowEl.appendChild(b)
      }

      document.getElementById('search').oninput = (e) => {
        query = e.target.value.trim().toLowerCase()
        render()
      }
      document.getElementById('reset').onclick = () => {
        selectedNode = null
        selectedFlow = null
        query = ''
        document.getElementById('search').value = ''
        hiddenTypes.clear()
        ;[...legendEl.children].forEach((c) => c.classList.remove('off'))
        view = { x: 0, y: 0, k: 1 }
        fit()
        render()
      }

      // ---- svg build ----
      const svg = document.getElementById('svg')
      const viewport = document.getElementById('viewport')
      const defs = document.getElementById('defs')
      for (const [type, color] of Object.entries(EDGE_COLOR)) {
        defs.insertAdjacentHTML(
          'beforeend',
          '<marker id="arrow-' +
            type +
            '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
            '<path d="M 0 0 L 10 5 L 0 10 z" fill="' +
            color +
            '"/></marker>',
        )
      }

      const gB = document.getElementById('g-boundaries')
      for (const b of BOUNDARIES) {
        const x0 = PAD_X + b.cols[0] * (NW + COL_GAP) - 18
        const last = b.cols[b.cols.length - 1]
        const x1 = PAD_X + last * (NW + COL_GAP) + NW + 18
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
        g.setAttribute('class', 'boundary')
        g.innerHTML =
          '<rect x="' +
          x0 +
          '" y="26" width="' +
          (x1 - x0) +
          '" height="' +
          (stageH - 52) +
          '" style="stroke:' +
          b.color +
          '33"/>' +
          '<text x="' +
          (x0 + 12) +
          '" y="46">' +
          b.title +
          '</text>'
        gB.appendChild(g)
      }

      const gE = document.getElementById('g-edges')
      const gEL = document.getElementById('g-edge-labels')
      const gN = document.getElementById('g-nodes')

      function anchors(a, b) {
        const dx = b.x - a.x
        if (dx > 0) return [{ x: a.x + NW, y: a.y + NH / 2 }, { x: b.x, y: b.y + NH / 2 }, 1]
        if (dx < 0) return [{ x: a.x, y: a.y + NH / 2 }, { x: b.x + NW, y: b.y + NH / 2 }, -1]
        return [{ x: a.x + NW, y: a.y + NH / 2 }, { x: b.x + NW, y: b.y + NH / 2 }, 0]
      }
      function pathFor(a, b) {
        const [s, t, dir] = anchors(a, b)
        if (dir === 0) {
          const off = 54
          return (
            'M' +
            s.x +
            ',' +
            s.y +
            ' C' +
            (s.x + off) +
            ',' +
            s.y +
            ' ' +
            (t.x + off) +
            ',' +
            t.y +
            ' ' +
            t.x +
            ',' +
            t.y
          )
        }
        const c = Math.max(46, Math.abs(t.x - s.x) * 0.45) * dir
        return (
          'M' +
          s.x +
          ',' +
          s.y +
          ' C' +
          (s.x + c) +
          ',' +
          s.y +
          ' ' +
          (t.x - c) +
          ',' +
          t.y +
          ' ' +
          t.x +
          ',' +
          t.y
        )
      }

      const edgeEls = DATA.edges.map((e, i) => {
        const a = pos.get(e.from),
          b = pos.get(e.to)
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        p.setAttribute('class', 'edge')
        p.setAttribute('d', pathFor(a, b))
        p.setAttribute('stroke', EDGE_COLOR[e.type])
        p.setAttribute('marker-end', 'url(#arrow-' + e.type + ')')
        gE.appendChild(p)
        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        lbl.setAttribute('class', 'edge-label')
        lbl.textContent = e.type
        gEL.appendChild(lbl)
        return { e, p, lbl, i }
      })
      function placeLabels() {
        for (const { e, p, lbl } of edgeEls) {
          const len = p.getTotalLength()
          if (!len) continue
          const pt = p.getPointAtLength(len / 2)
          lbl.setAttribute('x', pt.x)
          lbl.setAttribute('y', pt.y - 5)
        }
      }

      // --- DOM builders ---------------------------------------------------
      // The panel and the node boxes are assembled with createElement +
      // textContent rather than innerHTML. Every string below is map data read
      // from the embedded <script> block, and CodeQL is right that DOM text
      // flowing into innerHTML is a sink — hand-escaping does not clear that
      // path. Removing the sink does, and costs nothing here.
      function el(tag, attrs, ...kids) {
        const node = document.createElement(tag)
        for (const [k, v] of Object.entries(attrs || {})) {
          if (v == null) continue
          if (k === 'onclick') node.onclick = v
          else if (k === 'class') node.className = v
          else node.setAttribute(k, v)
        }
        for (const kid of kids.flat()) {
          if (kid == null || kid === false) continue
          node.appendChild(typeof kid === 'object' ? kid : document.createTextNode(String(kid)))
        }
        return node
      }
      const svgEl = (tag, attrs) => {
        const n = document.createElementNS('http://www.w3.org/2000/svg', tag)
        for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v)
        return n
      }
      const h3 = (t) => el('h3', null, t)
      const code = (t) => el('code', null, t)
      const empty = (t) => el('p', { class: 'empty' }, t)

      const nodeEls = DATA.nodes.map((n) => {
        const p = pos.get(n.id)
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
        g.setAttribute('class', 'node')
        g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')')
        const color = TYPE_COLOR[n.role] || '#8b949e'
        const label = n.label || n.id
        const short = n.path.replace(/^apps\/|^packages\//, '')
        g.append(
          svgEl('rect', { width: NW, height: NH, stroke: color }),
          svgEl('rect', { x: 0, y: 0, width: 4, height: NH, fill: color, rx: 2 }),
          Object.assign(svgEl('text', { class: 'n-label', x: 13, y: 22 }), { textContent: label }),
          Object.assign(svgEl('text', { class: 'n-path', x: 13, y: 38 }), { textContent: short }),
        )
        g.onclick = (ev) => {
          ev.stopPropagation()
          selectedNode = selectedNode === n.id ? null : n.id
          selectedFlow = null
          render()
        }
        makeDraggable(g, n.id)
        gN.appendChild(g)
        return { n, g }
      })

      // ---- drag nodes ----
      function makeDraggable(g, id) {
        let start = null
        g.addEventListener('pointerdown', (ev) => {
          ev.stopPropagation()
          start = { mx: ev.clientX, my: ev.clientY, ...pos.get(id) }
          g.setPointerCapture(ev.pointerId)
        })
        g.addEventListener('pointermove', (ev) => {
          if (!start) return
          const p = pos.get(id)
          p.x = start.x + (ev.clientX - start.mx) / view.k
          p.y = start.y + (ev.clientY - start.my) / view.k
          g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')')
          for (const { e, p: path } of edgeEls) {
            if (e.from === id || e.to === id)
              path.setAttribute('d', pathFor(pos.get(e.from), pos.get(e.to)))
          }
          placeLabels()
        })
        const end = (ev) => {
          if (start) {
            start = null
            try {
              g.releasePointerCapture(ev.pointerId)
            } catch {}
          }
        }
        g.addEventListener('pointerup', end)
        g.addEventListener('pointercancel', end)
      }

      // ---- pan & zoom ----
      let view = { x: 0, y: 0, k: 1 }
      function applyView() {
        viewport.setAttribute(
          'transform',
          'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')',
        )
      }
      function fit() {
        const r = svg.getBoundingClientRect()
        const k = Math.min(r.width / stageW, r.height / stageH, 1.15) * 0.94
        view.k = k
        view.x = (r.width - stageW * k) / 2
        view.y = (r.height - stageH * k) / 2
        applyView()
      }
      svg.addEventListener(
        'wheel',
        (ev) => {
          ev.preventDefault()
          const r = svg.getBoundingClientRect()
          const mx = ev.clientX - r.left,
            my = ev.clientY - r.top
          const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12
          const nk = Math.min(3, Math.max(0.25, view.k * f))
          view.x = mx - ((mx - view.x) * nk) / view.k
          view.y = my - ((my - view.y) * nk) / view.k
          view.k = nk
          applyView()
        },
        { passive: false },
      )
      let pan = null
      svg.addEventListener('pointerdown', (ev) => {
        pan = { mx: ev.clientX, my: ev.clientY, x: view.x, y: view.y }
        svg.classList.add('panning')
      })
      svg.addEventListener('pointermove', (ev) => {
        if (!pan) return
        view.x = pan.x + (ev.clientX - pan.mx)
        view.y = pan.y + (ev.clientY - pan.my)
        applyView()
      })
      const endPan = () => {
        pan = null
        svg.classList.remove('panning')
      }
      svg.addEventListener('pointerup', endPan)
      svg.addEventListener('pointerleave', endPan)
      svg.addEventListener('click', (ev) => {
        if (ev.target === svg || ev.target.closest('.boundary')) {
          selectedNode = null
          selectedFlow = null
          render()
        }
      })

      // ---- render / highlight ----
      function matches(n) {
        if (!query) return false
        const hay = [
          n.id,
          n.path,
          n.label,
          n.role,
          n.summary,
          (n.grouped_files || []).join(' '),
          n.tests.join(' '),
          n.entrypoints.map((e) => e.symbol + ' ' + e.path).join(' '),
          n.evidence.map((e) => e.symbol + ' ' + e.path).join(' '),
          n.constraints.join(' '),
        ]
          .join(' ')
          .toLowerCase()
        return hay.includes(query)
      }

      function render() {
        const visible = (n) => !hiddenTypes.has(n.role)
        let hlNodes = null,
          hlEdges = null

        if (selectedFlow) {
          const f = flowById.get(selectedFlow)
          hlNodes = new Set(f.steps)
          hlEdges = new Set()
          for (let i = 0; i < f.steps.length - 1; i++) {
            const a = f.steps[i],
              b = f.steps[i + 1]
            edgeEls.forEach(({ e }, idx) => {
              if ((e.from === a && e.to === b) || (e.from === b && e.to === a)) hlEdges.add(idx)
            })
          }
        } else if (selectedNode) {
          hlNodes = new Set([
            selectedNode,
            ...upstream.get(selectedNode),
            ...downstream.get(selectedNode),
          ])
          hlEdges = new Set()
          edgeEls.forEach(({ e }, idx) => {
            if (e.from === selectedNode || e.to === selectedNode) hlEdges.add(idx)
          })
        } else if (query) {
          hlNodes = new Set(DATA.nodes.filter(matches).map((n) => n.id))
          hlEdges = new Set()
          edgeEls.forEach(({ e }, idx) => {
            if (hlNodes.has(e.from) && hlNodes.has(e.to)) hlEdges.add(idx)
          })
        }

        for (const { n, g } of nodeEls) {
          g.classList.toggle('hidden', !visible(n))
          g.classList.toggle('sel', n.id === selectedNode)
          g.classList.toggle('up', !!selectedNode && upstream.get(selectedNode).has(n.id))
          g.classList.toggle('down', !!selectedNode && downstream.get(selectedNode).has(n.id))
          g.classList.toggle('dim', !!hlNodes && !hlNodes.has(n.id))
        }
        edgeEls.forEach(({ e, p, lbl }, idx) => {
          const vis = visible(byId.get(e.from)) && visible(byId.get(e.to))
          p.style.display = vis ? '' : 'none'
          lbl.style.display = vis ? '' : 'none'
          const on = !!hlEdges && hlEdges.has(idx)
          p.classList.toggle('hl', on)
          lbl.classList.toggle('hl', on)
          p.classList.toggle('dim', !!hlEdges && !on)
        })
        ;[...flowEl.children].forEach((b) =>
          b.classList.toggle('active', b.dataset.flow === selectedFlow),
        )
        renderPanel()
      }

      function nodeLink(id) {
        const n = byId.get(id)
        return el(
          'span',
          {
            class: 'rel',
            onclick: () => {
              selectedNode = id
              selectedFlow = null
              render()
            },
          },
          n ? n.label || n.id : id,
        )
      }
      function flowLink(id) {
        const f = flowById.get(id)
        return el(
          'span',
          {
            class: 'rel',
            onclick: () => {
              selectedFlow = id
              selectedNode = null
              render()
            },
          },
          f ? f.name : id,
        )
      }
      // one edge as a list item: "<target> <type>" then "path:line"
      const edgeItem = (e, otherId) =>
        el(
          'li',
          null,
          nodeLink(otherId),
          ' ',
          code(e.type),
          el('br'),
          code(e.evidence.path + ':' + e.evidence.line),
        )

      function renderPanel() {
        const panel = document.getElementById('panel')
        panel.replaceChildren()

        if (selectedFlow) {
          const f = flowById.get(selectedFlow)
          panel.append(
            el('h2', null, f.name),
            el('div', { class: 'sub' }, 'flow · ' + f.id),
            h3('Trigger'),
            el('p', null, f.trigger),
            h3('Path (' + f.steps.length + ' steps)'),
            el(
              'ol',
              { style: 'padding-left:18px;margin:0' },
              f.steps.map((s) => el('li', null, nodeLink(s))),
            ),
            h3('Outcome'),
            el('p', null, f.outcome),
          )
          return
        }

        if (!selectedNode) {
          panel.append(
            el('h2', null, 'Code map'),
            el(
              'div',
              { class: 'sub' },
              REPO + ' @ ' + (DATA.generated_from_commit || '').slice(0, 7),
            ),
            el(
              'p',
              { class: 'hint' },
              'Click any module to see its upstream callers, downstream dependencies, tests and flows. Pick a flow above to light up its whole path.',
            ),
            h3('Controls'),
            el(
              'ul',
              { class: 'hint' },
              el(
                'li',
                null,
                el('span', { class: 'kbd' }, 'click'),
                ' a module — highlight its neighborhood',
              ),
              el('li', null, el('span', { class: 'kbd' }, 'drag'), ' a module — reposition it'),
              el(
                'li',
                null,
                el('span', { class: 'kbd' }, 'drag'),
                ' background — pan · ',
                el('span', { class: 'kbd' }, 'wheel'),
                ' — zoom',
              ),
              el(
                'li',
                null,
                el('span', { class: 'kbd' }, 'search'),
                ' — matches ids, paths, symbols, constraints',
              ),
            ),
            h3('Flows'),
            el(
              'ul',
              null,
              DATA.flows.map((f) => el('li', null, flowLink(f.id))),
            ),
            h3('Scope'),
            el(
              'ul',
              null,
              DATA.scope.map((s) => el('li', null, code(s))),
            ),
          )
          return
        }

        const n = byId.get(selectedNode)
        const ups = [...upstream.get(n.id)]
        const downs = [...downstream.get(n.id)]
        const fl = flowsOf.get(n.id) || []
        const edgesIn = DATA.edges.filter((e) => e.to === n.id)
        const edgesOut = DATA.edges.filter((e) => e.from === n.id)

        panel.append(
          el(
            'span',
            { class: 'pill', style: 'background:' + (TYPE_COLOR[n.role] || '#8b949e') },
            TYPE_LABEL[n.role] || n.role,
          ),
          el('h2', null, n.label || n.id),
          el('div', { class: 'sub' }, n.path),
          n.summary ? el('p', null, n.summary) : null,

          h3('Upstream callers (' + ups.length + ')'),
          ups.length
            ? el(
                'ul',
                null,
                edgesIn.map((e) => edgeItem(e, e.from)),
              )
            : empty('None — nothing in scope calls into this.'),

          h3('Downstream dependencies (' + downs.length + ')'),
          downs.length
            ? el(
                'ul',
                null,
                edgesOut.map((e) => edgeItem(e, e.to)),
              )
            : empty('None — this is a leaf.'),

          h3('Flows (' + fl.length + ')'),
          fl.length
            ? el(
                'ul',
                null,
                fl.map((id) => el('li', null, flowLink(id))),
              )
            : empty('Not part of a mapped flow.'),

          h3('Tests (' + n.tests.length + ')'),
          n.tests.length
            ? el(
                'ul',
                null,
                n.tests.map((t) => el('li', null, code(t))),
              )
            : empty('No tests reference this module directly.'),

          h3('Entrypoints'),
          el(
            'ul',
            null,
            n.entrypoints.map((e) =>
              el('li', null, code(e.symbol), el('br'), code(e.path + ':' + e.line)),
            ),
          ),

          n.grouped_files && n.grouped_files.length ? h3('Grouped files') : null,
          n.grouped_files && n.grouped_files.length
            ? el(
                'ul',
                null,
                n.grouped_files.map((f) => el('li', null, code(f))),
              )
            : null,

          h3('Constraints'),
          n.constraints.length
            ? el(
                'ul',
                null,
                n.constraints.map((c) => el('li', null, c)),
              )
            : empty('None recorded.'),

          h3('Evidence'),
          el(
            'ul',
            null,
            n.evidence.map((e) =>
              el('li', null, code(e.path + ':' + e.line), el('br'), code(e.symbol)),
            ),
          ),
        )
      }

      window.addEventListener('resize', fit)
      fit()
      placeLabels()
      render()
    </script>
  </body>
</html>
